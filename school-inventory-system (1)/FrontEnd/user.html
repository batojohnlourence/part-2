<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - School Equipment Borrowing System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>
<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true" tabindex="-1">
  <label for="menu-toggle" class="menu-backdrop"></label>


  <!-- =====================================================
       USER MANAGEMENT PAGE
       Sidebar + top bar are the same on every page.
       If nobody is logged in, js/common.js sends the visitor back to index.html.
       ===================================================== -->
  <div id="app" class="app">

    <!-- Sidebar navigation (left): each button opens another page -->
    <aside id="sidebar" class="sidebar">
      <label for="menu-toggle" class="sidebar-close" role="button" aria-label="Close menu">✖</label>
      <img src="download.png" alt="logo">
      <span>School Inventory System</span>

      <!-- data-roles says which account types can see each link -->
      <nav class="sidebar-nav">
        <button type="button" class="nav-link" data-page="dashboard" data-roles="admin custodian" onclick="showPage('dashboard')">📊 <span>Dashboard</span></button>
        <button type="button" class="nav-link" data-page="equipment" data-roles="admin custodian" onclick="showPage('equipment')">📦 <span>Equipment</span></button>
        <button type="button" class="nav-link" data-page="users" data-roles="admin custodian" onclick="showPage('users')">👥 <span>Users</span></button>
        <button type="button" class="nav-link" data-page="requests" data-roles="admin custodian" onclick="showPage('requests')">📝 <span>Requests</span></button>
        <button type="button" class="nav-link" data-page="history" data-roles="admin custodian" onclick="showPage('history')">📜 <span>Borrowing History</span></button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="nav-link" onclick="logout()">🚪 <span>Log Out</span></button>
      </div>
    </aside>

    <!-- Right side: top bar + page content -->
    <div class="main">
      <header class="topbar glass">
        <label for="menu-toggle" id="menu-button" class="menu-button" role="button" aria-label="Open menu">☰</label>
        <h2 id="page-title">User Management</h2>
        <div class="topbar-user">
          <span id="user-name">User</span>
          <span id="user-role" class="badge badge-active">Role</span>
        </div>
      </header>

      <div class="content">

        <section id="page-users" class="page">
          <div class="toolbar glass">
            <input type="search" id="users-search" placeholder="🔍 Search users..." oninput="renderUsers()">
            <select id="users-type-filter" onchange="renderUsers()">
              <option value="all">All Users</option>
              <option value="student">Students</option>
              <option value="teacher">Teachers</option>
              <option value="staff">Admin / Custodian</option>
            </select>
            <button type="button" id="add-user-button" class="btn btn-primary" onclick="openAddUser()">➕ Add User</button>
          </div>
          <section class="panel glass">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>User ID</th><th>Full Name</th><th>ID Number</th><th>Email</th><th>Contact</th><th>Department / Grade</th><th>Type</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="users-body"></tbody>
              </table>
            </div>
          </section>
        </section>

      </div>
    </div>
  </div>

  <!-- =====================================================
       POPUPS (MODALS) used on this page
       ===================================================== -->

  <!-- Add / Edit user -->
  <div id="user-form-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-form-modal')">
    <div class="modal-box glass">
      <div class="modal-header"><h3 id="user-form-title">Add New User</h3><button type="button" class="close-button" onclick="closeModal('user-form-modal')">✖</button></div>
      <form id="user-form" class="form-grid" onsubmit="saveUser(event)">
        <input type="hidden" id="user-record-id">
        <div><label for="user-name-input">Full Name</label><input type="text" id="user-name-input" required></div>
        <div><label for="user-idnumber">Student Number / Employee ID / Username</label><input type="text" id="user-idnumber" required></div>
        <div><label for="user-email">Email Address</label><input type="email" id="user-email" required></div>
        <div><label for="user-contact">Contact Number</label><input type="text" id="user-contact" required></div>
        <div><label for="user-department">Department / Grade Level</label><input type="text" id="user-department" required></div>
        <div><label for="user-type">User Type</label>
          <select id="user-type" onchange="updateUserFormFields()">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="custodian">Custodian</option>
            <option value="admin">Administrator</option>
          </select></div>
        <div><label for="user-status">Account Status</label>
          <select id="user-status"><option>Active</option><option>Inactive</option></select></div>
        <div id="user-password-group"><label for="user-password">Password (login accounts only)</label><input type="password" id="user-password" minlength="6">
          <small id="user-password-hint" class="hint-text"></small></div>
        <div class="full-width modal-actions">
          <button type="button" class="btn" onclick="closeModal('user-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- A user's borrowing history -->
  <div id="user-history-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-history-modal')">
    <div class="modal-box modal-wide glass">
      <div class="modal-header"><h3 id="user-history-title">Borrowing History</h3><button type="button" class="close-button" onclick="closeModal('user-history-modal')">✖</button></div>
      <div id="user-history-body"></div>
    </div>
  </div>

  <!-- Small message that appears at the bottom of the screen -->
  <div id="toast" class="toast"></div>

  <script src="../BackEnd/common.js"></script>
  <script src="../BackEnd/users.js"></script>
</body>
</html>
